name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    # Linux: os testes de SQL e ponta a ponta sobem SQL Server via Testcontainers,
    # que precisa de containers Linux (indisponíveis nos runners Windows).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Sem versão aqui: o global.json fixa o SDK.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        # --locked-mode falha se packages.lock.json não bater com os projetos.
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --results-directory ./TestResults
          --report-xunit-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14
