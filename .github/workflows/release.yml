name: release

# Gera o pacote do serviço Windows (self-contained win-x64) e publica como GitHub Release.
# Disparo manual ou por tag v*. Só publica depois que o CI passou no mesmo commit.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish win-x64
        run: >
          dotnet publish src/IntegracaoSolidesDP.Worker/IntegracaoSolidesDP.Worker.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/IntegracaoSolidesDP

      - name: Package
        run: |
          cp INSTALL.md publish/IntegracaoSolidesDP/
          cp scripts/install-service.ps1 publish/IntegracaoSolidesDP/
          # appsettings.Development.json aponta para o fake/banco local: não vai para o cliente.
          rm -f publish/IntegracaoSolidesDP/appsettings.Development.json
          cd publish && zip -r "../IntegracaoSolidesDP-${{ steps.version.outputs.version }}-win-x64.zip" IntegracaoSolidesDP

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          "IntegracaoSolidesDP-${{ steps.version.outputs.version }}-win-x64.zip"
          --title "IntegracaoSolidesDP ${{ steps.version.outputs.version }}"
          --notes "Pacote do serviço Windows. Veja INSTALL.md dentro do zip."
          --target "${{ github.sha }}"
